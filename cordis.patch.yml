# Opt-in DeepSeek pricing widget (client plugin). Add this package to a profile
#
# Install as an overlay:
#   dsh web --patch packages/client/ui-price/cordis.patch.yml
#
# Or add this package to a profile's dsh.profile.bundles so its patch layer
# inserts the row on every boot of that profile.
- insert:
    - id: ui-price
      name: '@nathan5580/dsh-client-ui-price'
